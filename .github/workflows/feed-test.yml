name: Feed test

# Runs only when you press "Run workflow" on the Actions tab.
on:
  workflow_dispatch:

# Lets the workflow save test-results.md back into the repository.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Test each source
        run: python3 feed_test.py

      - name: Save the results file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results.md
          git commit -m "Feed test results" || echo "No changes to save"
          git push
